# Render Blueprint: one web service that builds the React client and serves it, with the API, from Node.
services:
  - type: web
    name: nascdi-explorer
    runtime: node
    plan: free
    buildCommand: npm --prefix client ci --include=dev && npm --prefix client run build && npm --prefix server ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
